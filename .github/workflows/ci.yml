name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee /tmp/pinchat-swift-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 80 /tmp/pinchat-swift-test.log | perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Swift tests failed::$message"
            exit "$status"
          fi

      - name: Check whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= HEAD
          fi
